<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏃‍♂️ 팀미르 훈련 공지</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #1e293b;
      padding: 20px 14px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 540px;
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
      color: #0f172a;
    }

    .sub-title {
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .row {
      margin-bottom: 12px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 0.9rem;
      outline: none;
      background: #ffffff;
    }

    input:focus, textarea:focus {
      border-color: #ef4444;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.15);
    }

    /* 조 카드 스타일 */
    .group-box {
      background: #ffffff;
      border: 1.5px solid #fed7aa;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .group-name-input {
      font-weight: 800;
      color: #ea580c;
      width: 110px;
      padding: 6px 8px;
    }

    .pace-badge {
      background: #ffedd5;
      color: #c2410c;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .btn-del {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 6px;
      margin-left: 6px;
    }

    .btn-del:hover {
      color: #ef4444;
    }

    .btn-add-group {
      width: 100%;
      background: #fff7ed;
      color: #ea580c;
      border: 1.5px dashed #fdba74;
      padding: 11px;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-add-group:hover {
      background: #ffedd5;
    }

    /* 미리보기 & 카톡 복사 */
    .preview-box {
      background: #0f172a;
      color: #f8fafc;
      border-radius: 12px;
      padding: 16px;
      font-family: monospace, sans-serif;
      font-size: 0.88rem;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.6;
      margin-bottom: 14px;
      min-height: 120px;
    }

    .btn-copy {
      width: 100%;
      background: #fae100;
      color: #371d1e;
      border: none;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(250, 225, 0, 0.35);
      transition: transform 0.1s;
    }

    .btn-copy:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏃‍♂️ 팀미르 훈련 공지</h1>
    <div class="sub-title">트랙 질주/회복 초수를 입력하면 페이스가 자동 계산됩니다!</div>

    <!-- 1. 기본 정보 입력 -->
    <div class="card">
      <div class="card-title">🎈 기본 정보</div>
      <div class="row">
        <label>공지 상단 제목</label>
        <input type="text" id="noticeHeading" value="🏃‍♂️ 팀미르 훈련 공지">
      </div>
      <div class="grid-2 row">
        <div>
          <label>날짜 선택</label>
          <input type="date" id="trainDate">
        </div>
        <div>
          <label>시작 시간</label>
          <input type="time" id="trainTime" value="18:30">
        </div>
      </div>
      <div class="row">
        <label>훈련 장소</label>
        <input type="text" id="trainPlace" placeholder="예: 종합운동장 트랙">
      </div>
    </div>

    <!-- 2. 조별 훈련 세팅 -->
    <div class="card">
      <div class="card-title">
        <span>💥 조별 훈련 내용 설정</span>
      </div>

      <div id="groupContainer"></div>

      <button type="button" class="btn-add-group" onclick="addGroup()">➕ 조 추가하기 (C조, D조...)</button>
    </div>

    <!-- 3. 참가 인원 작성 -->
    <div class="card">
      <div class="card-title">👥 참가인원 목록</div>
      <textarea id="attendees" rows="4" placeholder="1. &#10;2. &#10;3. &#10;(비워두면 카톡 공지 양식에 맞춰 기본 번호가 들어갑니다)"></textarea>
    </div>

    <!-- 4. 미리보기 & 복사 -->
    <label>💬 카카오톡 공지 미리보기</label>
    <div class="preview-box" id="previewText"></div>

    <button type="button" class="btn-copy" onclick="copyNotice()">💛 카카오톡 공지 복사하기</button>
  </div>

  <script>
    var groups = [
      { id: 1, name: 'A조', runM: 400, runSec: 80, restM: 200, restSec: 70, sets: 10 },
    ];

    /**
     * 페이스 환산 함수 (1km당 분/초 -> '320', '550' 등 문자열 반환)
     */
    function calcPace(meter, seconds) {
      var m = Number(meter);
      var s = Number(seconds);
      if (!s || s <= 0) return '';

      var secPerKm;
      if (m && m < 400 && m > 0) {
        // 400m 미만: 실제 거리 기준 1km 환산
        secPerKm = Math.round((s / m) * 1000);
      } else {
        // 400m 이상: 400m 랩타임 기준 고정 (초 * 2.5)
        secPerKm = Math.round(s * 2.5);
      }

      var minPart = Math.floor(secPerKm / 60);
      var secPart = secPerKm % 60;
      return '' + minPart + (secPart < 10 ? '0' + secPart : secPart);
    }

    /**
     * 질주 페이스 / 회복 페이스 텍스트 조합
     */
    function getCombinedPaceText(g) {
      var runPace = calcPace(g.runM, g.runSec);
      var restPace = calcPace(g.restM, g.restSec);

      if (runPace && restPace) {
        return runPace + ' / ' + restPace;
      } else if (runPace) {
        return runPace;
      } else if (restPace) {
        return '- / ' + restPace;
      }
      return '-';
    }

    function renderGroups() {
      var container = document.getElementById('groupContainer');
      var html = '';
      for (var i = 0; i < groups.length; i++) {
        var g = groups[i];
        var paceText = getCombinedPaceText(g);
        var badgeText = '페이스: ' + paceText;
        var delBtn = groups.length > 1 ? '<button type="button" class="btn-del" onclick="delGroup(' + g.id + ')">✕</button>' : '';

        html += '<div class="group-box">' +
          '<div class="group-header">' +
            '<input type="text" class="group-name-input" value="' + g.name + '" oninput="editGroup(' + g.id + ', \'name\', this.value)">' +
            '<div><span class="pace-badge" id="badge-' + g.id + '">' + badgeText + '</span>' + delBtn + '</div>' +
          '</div>' +
          '<div class="grid-4 row">' +
            '<div><label>질주(m)</label><input type="number" value="' + g.runM + '" step="50" oninput="editGroup(' + g.id + ', \'runM\', this.value)"></div>' +
            '<div><label>질주(초)</label><input type="number" value="' + g.runSec + '" oninput="editGroup(' + g.id + ', \'runSec\', this.value)"></div>' +
            '<div><label>회복(m)</label><input type="number" value="' + g.restM + '" step="50" oninput="editGroup(' + g.id + ', \'restM\', this.value)"></div>' +
            '<div><label>회복(초)</label><input type="number" value="' + g.restSec + '" oninput="editGroup(' + g.id + ', \'restSec\', this.value)"></div>' +
          '</div>' +
          '<div style="width: 120px;">' +
            '<label>세트수(회)</label><input type="number" value="' + g.sets + '" oninput="editGroup(' + g.id + ', \'sets\', this.value)">' +
          '</div>' +
        '</div>';
      }
      container.innerHTML = html;
    }

    function addGroup() {
      var nextChar = String.fromCharCode(65 + groups.length);
      groups.push({
        id: Date.now(),
        name: nextChar + '조',
        runM: 400,
        runSec: 92,
        restM: 200,
        restSec: 75,
        sets: 20
      });
      renderGroups();
      updatePreview();
    }

    function delGroup(id) {
      var next = [];
      for (var i = 0; i < groups.length; i++) {
        if (groups[i].id !== id) next.push(groups[i]);
      }
      groups = next;
      renderGroups();
      updatePreview();
    }

    function editGroup(id, key, val) {
      for (var i = 0; i < groups.length; i++) {
        if (groups[i].id === id) {
          groups[i][key] = (key === 'name') ? val : Number(val);
          var badge = document.getElementById('badge-' + id);
          if (badge) {
            badge.innerText = '페이스: ' + getCombinedPaceText(groups[i]);
          }
          break;
        }
      }
      updatePreview();
    }

    function generateNotice() {
      var headingVal = document.getElementById('noticeHeading').value.trim();
      var dateVal = document.getElementById('trainDate').value;
      var timeVal = document.getElementById('trainTime').value;
      var placeVal = document.getElementById('trainPlace').value.trim();
      var attendeesVal = document.getElementById('attendees').value.trim();

      var dateString = '*월 **일 (화) **시*분';
      if (dateVal) {
        var parts = dateVal.split('-');
        if (parts.length === 3) {
          var y = Number(parts[0]);
          var m = Number(parts[1]);
          var d = Number(parts[2]);
          var dt = new Date(y, m - 1, d);
          var days = ['일', '월', '화', '수', '목', '금', '토'];
          var dayName = days[dt.getDay()];

          if (timeVal) {
            var tParts = timeVal.split(':');
            var h = Number(tParts[0]);
            var min = tParts[1];
            dateString = m + '월 ' + d + '일 (' + dayName + ') ' + h + '시 ' + min + '분';
          } else {
            dateString = m + '월 ' + d + '일 (' + dayName + ')';
          }
        }
      }

      var text = (headingVal ? headingVal + '\n\n' : '');
      text += '🎈일시- ' + dateString + '\n';
      text += '🎈장소- ' + (placeVal ? placeVal : '') + '\n';
      text += '🎈내용-\n';

      for (var i = 0; i < groups.length; i++) {
        var g = groups[i];
        var paceText = getCombinedPaceText(g);
        var paceStr = (paceText !== '-') ? '(' + paceText + ')' : '';
        text += '💥' + g.name + '-' + paceStr + '\n';
        text += g.runM + '/' + g.restM + '(' + g.runSec + '”/' + g.restSec + '”)x' + g.sets + '\n\n';
      }

      text += '참가인원 :\n';
      if (attendeesVal) {
        text += attendeesVal;
      } else {
        text += '1. \n2. \n3. ';
      }

      return text;
    }

    function updatePreview() {
      var preview = document.getElementById('previewText');
      if (preview) {
        preview.innerText = generateNotice();
      }
    }

    function copyNotice() {
      var text = generateNotice();
      navigator.clipboard.writeText(text).then(function() {
        alert('팀미르 훈련 공지가 복사되었습니다!\n단톡방에 바로 붙여넣기(Ctrl+V)하세요. 🔥');
      }).catch(function() {
        alert('복사 실패! 미리보기 내용을 직접 복사해 주세요.');
      });
    }

    document.getElementById('noticeHeading').addEventListener('input', updatePreview);
    document.getElementById('trainDate').addEventListener('change', updatePreview);
    document.getElementById('trainTime').addEventListener('change', updatePreview);
    document.getElementById('trainPlace').addEventListener('input', updatePreview);
    document.getElementById('attendees').addEventListener('input', updatePreview);

    (function init() {
      var now = new Date();
      var yyyy = now.getFullYear();
      var mm = ('0' + (now.getMonth() + 1)).slice(-2);
      var dd = ('0' + now.getDate()).slice(-2);
      document.getElementById('trainDate').value = yyyy + '-' + mm + '-' + dd;

      renderGroups();
      updatePreview();
    })();
  </script>
</body>
</html>
